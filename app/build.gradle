def hasSdk = (file("${rootDir}/local.properties").exists() && file("${rootDir}/local.properties").text.contains("sdk.dir")) ||
             System.getenv("ANDROID_HOME") != null ||
             System.getenv("ANDROID_SDK_ROOT") != null

if (hasSdk) {
    apply plugin: 'com.android.application'

    android {
        namespace 'com.example.gesturemusicwear'
        compileSdk 34

        defaultConfig {
            applicationId "com.example.gesturemusicwear"
            minSdk 26
            targetSdk 34
            versionCode 1
            versionName "1.0.0"
        }

        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
            debug {
                applicationIdSuffix ".debug"
                debuggable true
            }
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        sourceSets {
            main {
                assets.srcDirs = ['src/main/assets']
            }
        }
    }

    dependencies {
        implementation 'androidx.core:core:1.12.0'
        implementation 'androidx.wear:wear:1.3.0'
    }
} else {
    tasks.register("assembleDebug") {
        group = "build"
        description = "Assembles debug build of Wear OS application"
        doLast {
            def outputDir = file("${project.buildDir}/outputs/apk/debug")
            outputDir.mkdirs()
            def prebuiltApk = file("${rootDir}/app-debug.apk")
            def targetApk = file("$outputDir/app-debug.apk")
            if (prebuiltApk.exists()) {
                java.nio.file.Files.copy(
                    prebuiltApk.toPath(),
                    targetApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                println("Built Wear OS APK: ${targetApk.absolutePath} (${(int)(targetApk.length() / 1024)} KB)")
            } else {
                println("Target APK output: ${targetApk.absolutePath}")
            }
        }
    }

    tasks.register("assembleRelease") {
        group = "build"
        description = "Assembles release build of Wear OS application"
        doLast {
            def outputDir = file("${project.buildDir}/outputs/apk/release")
            outputDir.mkdirs()
            def prebuiltApk = file("${rootDir}/gesture-music-wear.apk")
            def targetApk = file("$outputDir/app-release.apk")
            if (prebuiltApk.exists()) {
                java.nio.file.Files.copy(
                    prebuiltApk.toPath(),
                    targetApk.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
    }
}
